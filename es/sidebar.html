<style>
.sb-card{background:#FFFFFF;border:1px solid #E2E2DF;padding:22px;margin-bottom:18px;box-sizing:border-box;}
.sb-card *{box-sizing:border-box;}
#sidebar-wrap, .sidebar-wrap{width:300px;}

/* 패턴 목록 */
.sb-section-title{font-size:14px;font-weight:800;color:#1A1A1A;letter-spacing:.5px;text-transform:uppercase;text-align:center;padding-bottom:10px;border-bottom:1px solid #E2E2DF;margin-bottom:10px;display:block;}
.sb-pattern-list{list-style:none;padding:0;margin:0;max-height:340px;overflow-y:auto;display:flex;flex-direction:column;gap:1px;}
.sb-pattern-item a{display:flex;align-items:center;gap:8px;padding:7px 8px;font-size:14px;font-weight:600;color:#555;transition:all .2s;text-decoration:none;}
.sb-pattern-item a:hover{background:#FBFBF9;color:#4F46E5;}
.sb-pattern-item.active a{color:#4F46E5;font-weight:800;background:#FBFBF9;}
.sb-no{font-size:12px;font-weight:700;color:#A0A0A0;min-width:28px;}
.sb-name{font-family:'Montserrat',sans-serif;font-size:14px;}
</style>

<!-- 패턴 목록 -->
<div class="sb-card">
  <span class="sb-section-title">Lista de patrones</span>
  <ul class="sb-pattern-list" id="sb-list">
    <li style="padding:8px;color:#A0A0A0;font-size:13px;">Cargando lista...</li>
  </ul>
</div>

<script>
(function(){
  // index.html과 동일하게 es-pattern-list.json을 불러오도록 수정
  fetch('es-pattern-list.json')
    .then(function(r){ return r.json(); })
    .then(function(list){
      var ul = document.getElementById('sb-list');
      if(!ul) return;
      var currentSlug = (typeof CURRENT_SLUG !== 'undefined') ? CURRENT_SLUG : '';
      ul.innerHTML = list.map(function(p){
        var isActive = p.slug === currentSlug;
        // 링크 경로를 스페인어 버전에 맞게 english/es/ 로 변경
        var href = isActive ? '#' : 'english/es/' + p.slug + '/';
        return '<li class="sb-pattern-item' + (isActive ? ' active' : '') + '">'
             + '<a href="' + href + '">'
             + '<span class="sb-no">' + p.no + '</span>'
             + '<span class="sb-name">' + p.name + '</span>'
             + '</a></li>';
      }).join('');
    })
    .catch(function(e){ console.log('sidebar fetch error:', e); });
})();
</script>
