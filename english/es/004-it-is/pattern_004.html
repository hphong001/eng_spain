<script>
(function () {

    // ══════════════════════════════════════════════════════
    // 1. _x000A_ 등 엑셀 인코딩 잔재 제거
    //    voca는 HTML 태그를 포함하므로 태그 바깥의 텍스트만 정리
    // ══════════════════════════════════════════════════════
    function cleanStr(s) {
        if (!s) return '';
        return s
            .replace(/_x000A_/g, ' ')
            .replace(/_x000D_/g, '')
            .replace(/\r\n|\r|\n/g, ' ')
            .replace(/\s{2,}/g, ' ')
            .trim();
    }

    // voca는 HTML이므로 태그 사이 텍스트 노드만 정리
    function cleanVoca(v) {
        if (!v) return '';
        // HTML 태그를 보존하면서 _x000A_ 만 제거
        return v.replace(/_x000A_/g, ' ').replace(/_x000D_/g, '').replace(/\s{2,}/g, ' ');
    }

    DATA.examples.forEach(function(ex) {
        ex.s1_eng = cleanStr(ex.s1_eng); ex.s1_kor = cleanStr(ex.s1_kor);
        ex.s2_s1  = cleanStr(ex.s2_s1);  ex.s2_s2  = cleanStr(ex.s2_s2);  ex.s2_kor = cleanStr(ex.s2_kor);
        ex.s3_s1  = cleanStr(ex.s3_s1);  ex.s3_s2  = cleanStr(ex.s3_s2);
        ex.s3_s3  = cleanStr(ex.s3_s3);  ex.s3_kor = cleanStr(ex.s3_kor);
        ex.voca   = cleanVoca(ex.voca);
    });
    DATA.dialogueA_eng = cleanStr(DATA.dialogueA_eng);
    DATA.dialogueA_kor = cleanStr(DATA.dialogueA_kor);
    DATA.dialogueB_eng = cleanStr(DATA.dialogueB_eng);
    DATA.dialogueB_kor = cleanStr(DATA.dialogueB_kor);

    // ══════════════════════════════════════════════════════
    // 2. Grammar Point 렌더링
    //    규칙:
    //    - <br> 기준으로 문장 분리
    //    - 기본: 마침표 뒤 공백 2칸으로 이어서 한 줄 출력
    //    - 예외: 다음 문장의 순수 텍스트(HTML 태그 제외)가 5자 이하면 줄바꿈(<br>)
    // ══════════════════════════════════════════════════════
    function renderGrammar(raw) {
        if (!raw) return '';

        // <br> 기준으로 분리 (대소문자, 슬래시 유무 모두 처리)
        var parts = raw.split(/<br\s*\/?>/i).map(function(p) { return p.trim(); }).filter(Boolean);
        if (parts.length <= 1) return raw;

        // HTML 태그를 제거한 순수 텍스트 길이 계산
        function textLen(html) {
            return html.replace(/<[^>]*>/g, '').trim().length;
        }

        var result = '';
        for (var i = 0; i < parts.length; i++) {
            if (i === 0) {
                result += parts[i];
                continue;
            }
            var nextLen = textLen(parts[i]);
            if (nextLen <= 5) {
                // 5자 이하 → 줄바꿈
                result += '<br>' + parts[i];
            } else {
                // 그 외 → 공백 2칸으로 이어붙임
                result += '&nbsp;&nbsp;' + parts[i];
            }
        }
        return result;
    }

    // ══════════════════════════════════════════════════════
    // 3. 공통 정보 렌더링
    // ══════════════════════════════════════════════════════
    document.getElementById('page-title').textContent = 'Patrón ' + DATA.patternNo + ' - ' + DATA.patternTitle;
    document.getElementById('badge').textContent      = 'Patrón ' + DATA.patternNo;
    document.getElementById('title').textContent      = DATA.patternTitle;
    document.getElementById('meaning').textContent    = DATA.meaning;
    document.getElementById('qr-link').href = 'https://eng-book-redirect.garam781.workers.dev?p=4';
    document.getElementById('qr-img').src             = 'https://api.qrserver.com/v1/create-qr-code/?size=500x500&data=' + encodeURIComponent('https://eng-book-redirect.garam781.workers.dev?p=4');
    document.getElementById('grammar').innerHTML      = renderGrammar(DATA.grammarPoint);
    document.getElementById('mini-title').textContent = 'Patrón ' + DATA.patternNo + ' - Práctica adicional para dominar el patrón';
    document.getElementById('mini-sub').textContent   = DATA.patternTitle;

    var pNo = parseInt(DATA.patternNo);
    if (!isNaN(pNo)) {
        document.getElementById('page-num-1').textContent = '- ' + ((pNo * 2) - 1) + ' -';
        document.getElementById('page-num-2').textContent = '- ' + (pNo * 2) + ' -';
    }

    // ══════════════════════════════════════════════════════
    // 4. 예문 행 HTML 빌드
    // ══════════════════════════════════════════════════════
    function buildRow(ex, no) {
        var num = String(no).padStart(2, '0');
        return '<div class="ex-row">'
            + '<div class="td-no">' + num + '</div>'
            + '<div class="ex-content">'
            +   '<div class="line-inline">'
            +     '<div class="eng-text"><span class="c-s1">' + ex.s1_eng + '</span></div>'
            +     '<div class="kor-text">' + ex.s1_kor + '</div>'
            +   '</div>'
            +   '<div class="line-inline">'
            +     '<div class="eng-text">'
            +       '<span class="c-s1">' + ex.s2_s1 + '</span>'
            +       '<span class="c-s2"> ' + ex.s2_s2 + '</span>'
            +     '</div>'
            +     '<div class="kor-text">' + ex.s2_kor + '</div>'
            +   '</div>'
            +   '<div class="line-block">'
            +     '<div class="eng-text">'
            +       '<span class="c-s1">' + ex.s3_s1 + '</span>'
            +       '<span class="c-s2"> ' + ex.s3_s2 + '</span>'
            +       '<span class="c-s3"> ' + ex.s3_s3 + '</span>'
            +     '</div>'
            +     '<div class="kor-text" style="margin-bottom:1px;">' + ex.s3_kor + '</div>'
            +   '</div>'
            +   '<div class="inline-voca">' + ex.voca + '</div>'
            + '</div>'
            + '</div>';
    }

    // ══════════════════════════════════════════════════════
    // 5. 1페이지 예문 렌더 + reflow 강제
    // ══════════════════════════════════════════════════════
    function renderP1(count) {
        var html = '';
        for (var i = 0; i < count; i++) html += buildRow(DATA.examples[i], i + 1);
        document.getElementById('tbody-p1').innerHTML = html;
    }

    function renderP2(startIdx) {
        var html = '';
        for (var i = startIdx; i < 10; i++) html += buildRow(DATA.examples[i], i + 1);
        document.getElementById('tbody-p2').innerHTML = html;
    }

    // ══════════════════════════════════════════════════════
    // 5. 넘침 감지
    //    ex-row를 자연 높이(flex:none)로 측정
    //    → 각 행 scrollHeight 합산 vs 테이블 가용 높이 비교
    // ══════════════════════════════════════════════════════
    function isOverflow(tbodyId, tableId) {
        var tbody  = document.getElementById(tbodyId);
        var table  = document.getElementById(tableId);
        var header = table.querySelector('.table-header');
        var available = table.clientHeight - (header ? header.offsetHeight : 0);
        var rows = tbody.querySelectorAll('.ex-row');
        var totalH = 0;
        rows.forEach(function(r) { totalH += r.scrollHeight; });
        return totalH > available;
    }

    // ══════════════════════════════════════════════════════
    // 6. 균등 패딩 적용
    //    남는 공간을 행 수로 나눠 위아래 패딩으로 균등 분배
    //    → 행 높이는 내용마다 다르지만 위아래 여백은 모두 동일
    //    voca margin-top이 8px이므로 하단 패딩에서 3px 차감
    //    (5px 기준 대비 +3px 올라간 만큼 하단에서 상쇄)
    // ══════════════════════════════════════════════════════
    function applyEqualPadding(tbodyId, tableId) {
        var tbody = document.getElementById(tbodyId);
        var rows  = tbody.querySelectorAll('.ex-row');
        if (!rows.length) return;

        var MIN_PAD_TOP = 4;  // 최소 위 패딩(px)
        var MIN_PAD_BOT = 2;  // 최소 아래 패딩(px) — voca margin이 여백 역할
        var VOCA_EXTRA  = 3;  // voca margin 증가분(8px-5px) → 하단에서 차감

        // 패딩 0으로 임시 제거 후 자연 높이 합산
        var totalNatural = 0;
        rows.forEach(function(r) {
            var content = r.querySelector('.ex-content');
            content.style.paddingTop    = '0';
            content.style.paddingBottom = '0';
            totalNatural += r.scrollHeight;
        });

        // 남는 공간 → 행당 추가 여백 계산
        var available   = tbody.clientHeight;
        var extra       = available - totalNatural;
        var extraPerRow = Math.max(0, Math.floor(extra / rows.length));
        var padTop      = Math.max(MIN_PAD_TOP, Math.floor(extraPerRow / 2));
        var padBot      = Math.max(MIN_PAD_BOT, padTop - VOCA_EXTRA);

        // 모든 행에 동일한 패딩 적용
        rows.forEach(function(r) {
            var content = r.querySelector('.ex-content');
            content.style.paddingTop    = padTop + 'px';
            content.style.paddingBottom = padBot + 'px';
        });
    }

    // ══════════════════════════════════════════════════════
    // 7. 자동 조정: 5 → 4 → 3 순 시도 후 균등 패딩 적용
    // ══════════════════════════════════════════════════════
    function adjustLayout() {
        var counts = [5, 4, 3];

        for (var idx = 0; idx < counts.length; idx++) {
            var p1Count = counts[idx];

            renderP1(p1Count);
            void document.getElementById('tbody-p1').offsetHeight;

            if (!isOverflow('tbody-p1', 'table-p1') || idx === counts.length - 1) {
                // 확정 → 균등 패딩 적용
                applyEqualPadding('tbody-p1', 'table-p1');

                renderP2(p1Count);
                void document.getElementById('tbody-p2').offsetHeight;
                applyEqualPadding('tbody-p2', null);
                return;
            }
        }
    }

    // ══════════════════════════════════════════════════════
    // 7. 다이얼로그 렌더링
    // ══════════════════════════════════════════════════════
    function renderDialogue() {
        var gray = ' <span style="color:#6B7280;font-size:13px;font-weight:500;margin-left:6px;">';
        document.getElementById('dlg-a').innerHTML =
            DATA.dialogueA_eng + gray + '(' + DATA.dialogueA_kor + ')</span>';
        document.getElementById('dlg-b').innerHTML =
            DATA.dialogueB_eng + gray + '(' + DATA.dialogueB_kor + ')</span>';
    }

    // ══════════════════════════════════════════════════════
    // 8. 실행 — 웹폰트 로드 완료 후 측정 (핵심)
    //    Pretendard가 비동기 로드되므로 fonts.ready 이후에 높이 측정해야
    //    폰트 적용 전/후 높이 차이로 인한 잘못된 판단 방지
    // ══════════════════════════════════════════════════════
    document.fonts.ready.then(function () {
        requestAnimationFrame(function () {
            adjustLayout();
            renderDialogue();
            document.body.style.visibility = 'visible';
        });
    });

})();
</script>
